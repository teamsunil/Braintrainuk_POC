<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">

<body>
<div id="app"></div>
<template id="tpl">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
html{scroll-behavior:smooth}
body{margin:0;background:#FBFAFC}
a{color:#3B1954}a:hover{color:#2F7A3A}
.bt *{box-sizing:border-box}
.bt h1,.bt h2,.bt h3{font-family:Manrope,'Segoe UI',system-ui,sans-serif;font-weight:700}
.wrap{max-width:1280px;margin:0 auto;padding:0 24px}
.eyebrow{margin:0 0 18px;display:inline-flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:12px;color:#2F7A3A}
.eyebrow::before{content:"";width:22px;height:2px;border-radius:2px;background:currentColor}
.navlink{color:#3B1954;text-decoration:none;font-weight:600;font-size:15px;padding:12px 4px;position:relative}
.navlink::after{content:"";position:absolute;left:4px;right:4px;bottom:6px;height:2px;border-radius:2px;background:#6BB964;transform:scaleX(0);transform-origin:left;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.navlink:hover{color:#3B1954}.navlink:hover::after{transform:scaleX(1)}
.btn{transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s,background .3s,color .3s}
.btn:hover{transform:translateY(-2px)}
.btn svg{transition:transform .3s}.btn:hover svg{transform:translateX(4px)}
.btn-g:hover{box-shadow:0 14px 30px -12px rgba(107,185,100,.85);color:#1F0E2E}
.btn-o:hover{background:rgba(255,255,255,.1);color:#fff}
.btn-p:hover{box-shadow:0 14px 30px -12px rgba(59,25,84,.6);color:#fff}
.lift{transition:transform .6s cubic-bezier(.2,.8,.2,1),box-shadow .6s,border-color .5s}
.lift:hover{transform:translateY(-8px);box-shadow:0 34px 70px -34px rgba(59,25,84,.45),0 0 0 1px rgba(107,185,100,.3),0 0 70px -14px rgba(107,185,100,.4)}
.ph{overflow:hidden;position:relative}
.ph .inner{position:absolute;inset:0;transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
.lift:hover .ph .inner{transform:scale(1.08)}
.arrowc{transition:transform .4s cubic-bezier(.2,.8,.2,1),background .3s}
.lift:hover .arrowc{transform:rotate(-45deg);background:#6BB964}
/* condition chips */
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.chip{animation:pop .55s cubic-bezier(.2,.8,.2,1) both;transition:background .25s,color .25s,border-color .25s,transform .25s}
.chip:hover{background:#3B1954;color:#fff;border-color:#3B1954;transform:translateY(-2px)}
.cico{width:32px;height:32px;border-radius:10px;background:#EFF7EE;color:#2F7A3A;display:flex;align-items:center;justify-content:center;flex:none;transition:background .25s,color .25s,transform .45s cubic-bezier(.2,.8,.2,1)}
.chip:hover .cico{background:rgba(255,255,255,.14);color:#8EE086;transform:rotate(-8deg) scale(1.06)}
.cat{transition:color .3s,padding .4s cubic-bezier(.2,.8,.2,1)}
.cat:hover{color:#3B1954;padding-left:10px}
/* location rows */
.lrow{position:relative;overflow:hidden;transition:color .35s}
.lrow::before{content:"";position:absolute;inset:0;background:#3B1954;transform:scaleY(0);transform-origin:bottom;transition:transform .5s cubic-bezier(.2,.8,.2,1);z-index:0}
.lrow:hover::before{transform:scaleY(1)}
.lrow:hover,.lrow:hover *{color:#FFFFFF !important}
.lrow:hover .ltag{border-color:rgba(255,255,255,.5) !important}
.lrow > *{position:relative;z-index:1}
.logo-cell img{filter:grayscale(1);opacity:.55;transition:filter .4s,opacity .4s,transform .4s}
.logo-cell:hover img{filter:none;opacity:1;transform:scale(1.05)}
.lrow .la{transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.lrow:hover .la{transform:translateX(8px) rotate(-45deg)}
.lrow:hover .ltag{border-color:rgba(255,255,255,.4);color:#C9F0C4}
/* reveal on scroll */
html.io .rv{opacity:0;transform:translateY(40px);transition:opacity 1s cubic-bezier(.2,.8,.2,1),transform 1s cubic-bezier(.2,.8,.2,1)}
html.io .rv.left{transform:translateX(-50px)}
html.io .rv.right{transform:translateX(50px)}
html.io .rv.zoom{transform:scale(.92)}
html.io .rv[data-in]{opacity:1;transform:none}
.ln{display:block;overflow:hidden;padding-bottom:.08em;margin-bottom:-.08em}
.ln > span{display:inline-block}
html.io .rv.lines{opacity:1;transform:none}
html.io .rv.lines .ln > span{transform:translateY(110%);transition:transform 1.1s cubic-bezier(.2,.8,.2,1)}
html.io .rv.lines[data-in] .ln > span{transform:none}
.ln:nth-child(2) > span{transition-delay:.1s !important}.ln:nth-child(3) > span{transition-delay:.2s !important}
html.io .rv.clip{opacity:1;transform:none;clip-path:inset(14% 14% 14% 14% round 32px);transition:clip-path 1.5s cubic-bezier(.2,.8,.2,1)}
html.io .rv.clip[data-in]{clip-path:inset(0 0 0 0 round 32px)}
html.io .rv.clip .inner{transform:scale(1.25);transition:transform 1.8s cubic-bezier(.2,.8,.2,1)}
html.io .rv.clip[data-in] .inner{transform:scale(1)}
html.io .rv.grow{opacity:1;transform:scaleX(0);transform-origin:left;transition:transform 1.6s cubic-bezier(.2,.8,.2,1) .2s}
html.io .rv.grow[data-in]{transform:scaleX(1)}
.glowtxt{text-shadow:0 0 34px rgba(142,224,134,.45)}
.team img{width:58px;height:58px;border-radius:50%;object-fit:cover;border:3px solid #3B1954;margin-left:-16px;position:relative;transition:margin .5s cubic-bezier(.2,.8,.2,1),transform .4s cubic-bezier(.2,.8,.2,1)}
.team img:first-child{margin-left:0}
.lift:hover .team img{margin-left:-4px}
.team img:hover{transform:translateY(-6px) scale(1.1);z-index:2}
.team img:first-child{margin-left:0 !important}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{transform-origin:center;transform-box:fill-box;animation:spin 160s linear infinite}
.spin.rev{animation-direction:reverse;animation-duration:200s}
@keyframes corepulse{0%,100%{opacity:.9;transform:scale(1)}50%{opacity:.5;transform:scale(1.6)}}
.core{transform-origin:center;transform-box:fill-box;animation:corepulse 4s ease-in-out infinite}
/* consultation popup */
@keyframes mfade{from{opacity:0}to{opacity:1}}
@keyframes mpop{from{opacity:0;transform:translateY(40px) scale(.95)}to{opacity:1;transform:none}}
@keyframes kenburns{from{transform:scale(1.18)}to{transform:scale(1.02)}}
@keyframes mrise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes sig2{from{stroke-dashoffset:132}to{stroke-dashoffset:0}}
@keyframes npulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.8)}}
@keyframes chk{to{stroke-dashoffset:0}}
@keyframes sring{0%{transform:scale(.7);opacity:1}100%{transform:scale(1.15);opacity:0}}
.mback{position:fixed;inset:0;z-index:300;background:rgba(18,8,30,.66);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:24px;animation:mfade .45s ease both}
.mbox{position:relative;width:100%;max-width:1040px;max-height:calc(100vh - 48px);overflow:auto;background:#FFFFFF;border-radius:32px;box-shadow:0 60px 120px -40px rgba(18,8,30,.8),0 0 0 1px rgba(255,255,255,.08),0 0 90px -20px rgba(139,92,214,.55);animation:mpop .7s cubic-bezier(.2,.8,.2,1) both}
.mgrid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);min-height:600px}
.mleft{position:relative;overflow:hidden;background:#12081E;padding:40px;display:flex;flex-direction:column}
.mright{padding:40px 44px}
.mimg{animation:kenburns 10s ease-out both}
.mfield{animation:mrise .7s cubic-bezier(.2,.8,.2,1) both}
.mpulse{stroke-dasharray:6 126;animation:sig2 3s linear infinite}
.npulse{transform-origin:center;transform-box:fill-box;animation:npulse 2.6s ease-in-out infinite}
.mclose{position:absolute;top:16px;right:16px;z-index:5;width:44px;height:44px;border-radius:50%;border:1px solid #E4DAEE;background:#FFFFFF;color:#2A1140;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .35s cubic-bezier(.2,.8,.2,1),background .3s,color .3s}
.mclose:hover{transform:rotate(90deg);background:#3B1954;color:#FFFFFF}
.inp{width:100%;border:1px solid #E4DAEE;border-radius:14px;padding:13px 15px;font-family:inherit;font-size:16px;font-weight:500;color:#2A1140;background:#FBFAFC;transition:border-color .3s,box-shadow .3s,background .3s}
.inp:hover{border-color:#C9B6DE}
.inp:focus{outline:none;border-color:#6BB964;background:#FFFFFF;box-shadow:0 0 0 4px rgba(107,185,100,.18)}
.who label{position:relative;cursor:pointer}
.who input{position:absolute;opacity:0;width:1px;height:1px}
.who span{display:inline-flex;align-items:center;min-height:44px;padding:10px 18px;border-radius:999px;border:1px solid #E4DAEE;background:#FBFAFC;font-weight:700;font-size:15px;color:#4A3A5A;transition:all .3s}
.who label:hover span{border-color:#B79AD6}
.who input:checked + span{background:#3B1954;border-color:#3B1954;color:#FFFFFF;box-shadow:0 10px 24px -12px rgba(59,25,84,.6)}
.who input:focus-visible + span{outline:2px solid #6BB964;outline-offset:2px}
.chk{stroke-dasharray:1;stroke-dashoffset:1;animation:chk .8s cubic-bezier(.65,0,.35,1) .35s forwards}
.sring{transform-origin:center;transform-box:fill-box;animation:sring 2.2s ease-out infinite}
@media (max-width:860px){.mgrid{grid-template-columns:1fr;min-height:0}.mleft{min-height:300px;padding:28px}.mright{padding:28px 22px}.mback{padding:10px;align-items:flex-start}.mbox{max-height:calc(100vh - 20px)}}
.drawp{stroke-dasharray:1;stroke-dashoffset:0}
html.io .rv .drawp{stroke-dashoffset:1;transition:stroke-dashoffset 3.2s cubic-bezier(.45,0,.2,1) .3s}
html.io .rv[data-in] .drawp{stroke-dashoffset:0}
.img{width:100%;height:100%;object-fit:cover;display:block}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(50px,-40px) scale(1.12)}}
.orb{position:absolute;border-radius:50%;filter:blur(90px);pointer-events:none;animation:drift 18s ease-in-out infinite;z-index:0}
.orb.d2{animation-duration:24s;animation-delay:-9s}
.wrap{position:relative;z-index:1}
.btn-g{box-shadow:0 10px 34px -12px rgba(107,185,100,.65)}
/* hero story */
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
.rise{animation:rise 1s cubic-bezier(.2,.8,.2,1) both}.r1{animation-delay:.75s}.r2{animation-delay:.9s}.r3{animation-delay:1.05s}.r4{animation-delay:1.2s}.r5{animation-delay:1.35s}
.pwrap{position:absolute;inset:0;display:flex;align-items:center;padding:96px max(24px, calc((100% - 1280px) / 2 + 24px)) 40px;pointer-events:none}
.panel{transition:opacity .45s ease,transform .6s cubic-bezier(.2,.8,.2,1)}
@keyframes flow{to{stroke-dashoffset:-2000}}
.wave{stroke-dasharray:3 7;animation:flow 50s linear infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.floaty{animation:floaty 6s ease-in-out infinite}
@keyframes marquee{to{transform:translateX(-50%)}}
.marquee{animation:marquee 46s linear infinite}
.marquee.rev{animation-direction:reverse;animation-duration:56s}
.mq:hover .marquee{animation-play-state:paused}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.blink{animation:blink 1.6s ease-in-out infinite}
@keyframes scrollhint{0%{transform:translateY(0);opacity:1}80%{transform:translateY(14px);opacity:0}100%{opacity:0}}
.scrollhint{animation:scrollhint 1.8s ease-in-out infinite}
@keyframes ring{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1);opacity:0}}
.ring{transform-origin:center;transform-box:fill-box;animation:ring 4.5s ease-out infinite}
.ring.d2{animation-delay:1.5s}.ring.d3{animation-delay:3s}
@keyframes fillbar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.mob{display:none !important}
@media (max-width:980px){
.desk{display:none !important}.mob{display:flex !important}
.h2{font-size:38px !important}.huge{font-size:44px !important}
.two{grid-template-columns:1fr !important}
.stickyhead{position:static !important}
.bento{grid-template-columns:1fr !important}.bento > *{grid-column:auto !important;grid-row:auto !important;min-height:300px}
.hs{height:auto !important}.hs-stick{position:relative !important;height:auto !important;padding:96px 0 !important}
.track{transform:none !important;flex-direction:column !important;width:auto !important;padding:0 24px !important}
.scard{width:auto !important;height:auto !important}
.lrow{grid-template-columns:40px 1fr 40px !important}.ltag{display:none !important}
.wordmark{font-size:64px !important}
}
@media (max-width:820px){.pwrap{align-items:flex-end !important;justify-content:center !important;padding:0 20px 64px !important}.panel{text-align:left;background:rgba(18,8,30,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:22px;border-radius:20px}.h1{font-size:40px !important}}
.still *,.still *::before,.still *::after{animation:none !important}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}.bt *{animation:none !important;transition:none !important}html.io .rv{opacity:1;transform:none;clip-path:none}}
</style>
</helmet>

<div style="background: #1F0E2E; color: #E9E1F1; font-size: 13px">

</div>

<!-- 1. HERO: particle brain story -->
<section id="top" style="position: relative; background: #12081E">
<div id="story" onMouseMove="{{heroMove}}" onMouseLeave="{{heroLeave}}" style="position: relative; height: 360vh">
<div style="position: sticky; top: 0; height: 100vh; overflow: hidden; color: #FFFFFF; background: radial-gradient(60% 55% at 70% 50%, rgba(139,92,214,.16), rgba(18,8,30,0) 70%), radial-gradient(40% 40% at 15% 85%, rgba(107,185,100,.10), rgba(18,8,30,0) 70%), #12081E">
<div aria-hidden="true" style="position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px); background-size: 120px 120px; -webkit-mask-image: linear-gradient(180deg, transparent, #000 25%, #000 70%, transparent); mask-image: linear-gradient(180deg, transparent, #000 25%, #000 70%, transparent)"></div>
<div aria-hidden="true" style="position: absolute; inset: -40px; background-image: radial-gradient(rgba(201,169,238,.32) 1px, transparent 1.6px); background-size: 30px 30px; -webkit-mask-image: radial-gradient(65% 70% at 66% 52%, #000 0%, transparent 72%); mask-image: radial-gradient(65% 70% at 66% 52%, #000 0%, transparent 72%); transform: {{pDots}}"></div>
<div class="orb" aria-hidden="true" style="width: 520px; height: 520px; background: rgba(139,92,214,.35); left: -160px; top: 10%"></div>

<svg aria-hidden="true" style="position: absolute; left: 0; bottom: 80px; width: 100%; height: 90px; opacity: .55; filter: drop-shadow(0 0 6px rgba(107,185,100,.7))" viewBox="0 0 1440 90" preserveAspectRatio="none"><path d="{{eeg2}}" fill="none" stroke="#6BB964" stroke-width="1.4" class="wave"></path><path d="{{eeg3}}" fill="none" stroke="#B79AD6" stroke-opacity=".7" stroke-width="1"></path></svg>

<span style="background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.16); padding: 8px 15px; border-radius: 999px; font-weight: 600; font-size: 14px">No talking</span>

<span style="background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.16); padding: 8px 15px; border-radius: 999px; font-weight: 600; font-size: 14px">No waiting</span>
</div>
<p class="rise r4" style="font-size: 18px; line-height: 1.6; color: #DCD0E8; margin: 0 0 30px">An evidence-based, medication-free way to improve mental, emotional and behavioural wellbeing — using your brain’s natural neuroplasticity to create change that lasts.</p>

<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>

</div>
</div>
</div>
